name: Release QA & Web UI E2E Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Unit, Integration & Race Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Backend Tests
        run: go test -v ./...

      - name: Run Backend Tests with Race Detector
        run: go test -v -race ./...

  frontend-e2e:
    name: Frontend Build, Types & Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend Build
        working-directory: frontend
        run: npm run build

      - name: Build Go Server Binary
        run: |
          cp -r frontend/dist/. backend/embedded/dist/
          go build -o bin/super-proxy-web ./backend/cmd/server

      - name: Install Playwright Browsers & Dependencies
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Execute Full Web UI Browser E2E Test Suite
        working-directory: frontend
        run: npm run test:e2e
